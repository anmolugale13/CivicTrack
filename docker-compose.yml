version: "3.9"

services:
  backend:
    build: ./backend
    container_name: civictrack-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: civictrack-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
